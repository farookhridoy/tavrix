<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; font-src 'self' data:; img-src 'self' data:" />
  <title>Tavrix</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="titlebar">
    <div id="layoutTools">
      <button id="tglSessions" class="on icon" title="Show or hide the sessions sidebar (⌘B)" aria-label="Show or hide the sessions sidebar">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" fill="none" stroke="currentColor"/><path d="M6 2.5v11" stroke="currentColor"/><rect x="2" y="3" width="3.6" height="10" fill="currentColor" class="fill"/></svg>
      </button>
      <button id="tglFiles" class="on icon" title="Show or hide the file panel (⌘⇧B)" aria-label="Show or hide the file panel">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M1.5 4.2c0-.7.5-1.2 1.2-1.2h3.1l1.4 1.6h6.1c.7 0 1.2.5 1.2 1.2v6.2c0 .7-.5 1.2-1.2 1.2H2.7c-.7 0-1.2-.5-1.2-1.2z" fill="none" stroke="currentColor"/><path d="M1.6 6.6h12.8" stroke="currentColor"/></svg>
      </button>
    </div>
    <div id="helpTools">
      <button id="helpManual" title="Open the manual (F1)" aria-label="Open the manual">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3.2c1.9-.5 3.7-.3 5.5.8 1.8-1.1 3.6-1.3 5.5-.8v8.9c-1.9-.5-3.7-.3-5.5.8-1.8-1.1-3.6-1.3-5.5-.8z" fill="none" stroke="currentColor" stroke-linejoin="round"/><path d="M8 4v8.9" stroke="currentColor"/></svg>
        Manual
      </button>
    </div>
  </div>
  <div id="update" hidden>
    <span id="updateMsg"></span>
    <span class="btns">
      <button id="updDownload">Download</button>
      <button id="updNotes">Release notes</button>
      <button id="updLater">Later</button>
      <button id="updSkip" title="Don't tell me about this version again">Skip this version</button>
    </span>
  </div>
  <div id="app">
    <aside id="sessions">
      <div class="head">
        <strong>Sessions</strong>
        <span><button id="new" title="New SSH connection: terminal, files and editor">+</button><button id="newSftp" title="New SFTP session: files and editor only, no terminal">SFTP</button><button id="import" title="Import hosts from your ~/.ssh/config" aria-label="Import hosts from ~/.ssh/config">⤓</button><button id="gear" title="Settings (⌘,)">⚙</button></span>
      </div>
      <ul id="sessionList"></ul>
      <div class="head">
        <strong>Snippets</strong>
        <span><button id="newSnippet" title="New snippet">+</button></span>
      </div>
      <ul id="snippetList"></ul>
      <div id="notice"></div>
    </aside>
    <div id="sessionsSplit" class="splitter v" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize; double-click to reset"></div>
    <div id="content">
      <div id="tabbar"></div>
      <div id="panes"></div>
    </div>
  </div>

  <dialog id="dlg">
    <form id="form">
      <h3 id="dlgTitle">New connection</h3>
      <input id="f-id" type="hidden" />
      <div class="tabs" id="sTabs">
        <button type="button" data-tab="basic" class="on">Basic</button>
        <button type="button" data-tab="adv">Advanced</button>
        <button type="button" data-tab="term">Terminal</button>
        <button type="button" data-tab="book">Bookmark</button>
      </div>
      <div class="tabpane" data-pane="basic">
        <label>Session type
          <select id="f-kind">
            <option value="ssh">SSH: terminal, files and editor</option>
            <option value="sftp">SFTP: files and editor only (no terminal)</option>
          </select>
        </label>
        <label><span class="lab">Name <span class="opt">(optional)</span></span>
          <input id="f-name" placeholder="e.g. web-01" />
        </label>
        <div class="row2">
          <label>Host
            <input id="f-host" placeholder="example.com or 203.0.113.10" required />
          </label>
          <label>Port
            <input id="f-port" type="number" min="1" max="65535" value="22" />
          </label>
        </div>
        <label>Username
          <input id="f-user" placeholder="deploy" required />
        </label>
        <label><span class="lab">Password <span class="opt">(or the passphrase of your key; leave blank to be asked)</span></span>
          <input id="f-pass" type="password" placeholder="Password" />
        </label>
        <div class="field">
          <span class="lab">Private key file <span class="opt">(optional)</span></span>
          <div class="keyrow">
            <input id="f-key" placeholder="Choose the key file, e.g. ~/.ssh/id_ed25519" />
            <button type="button" id="f-keybrowse" title="Choose a private key file">Browse…</button>
          </div>
          <div id="f-keyhint" class="hint"></div>
        </div>
      </div>
      <div class="tabpane" data-pane="adv" hidden>
        <label>Jump host (connect through another saved session)
          <select id="f-jump"><option value="">None</option></select>
        </label>
        <label>Keep-alive every (seconds, 0 = off; blank = default)
          <input id="f-keepalive" type="number" min="0" max="3600" placeholder="default" />
        </label>
        <label>Compression
          <select id="f-compress"><option value="">Default</option><option value="true">On</option><option value="false">Off</option></select>
        </label>
        <label>Connect timeout (seconds; blank = default)
          <input id="f-timeout" type="number" min="5" max="120" placeholder="default" />
        </label>
        <label><span id="f-sdir-lab">Start in folder (typed as cd in the first terminal)</span>
          <input id="f-sdir" placeholder="/var/www" />
        </label>
        <label id="f-scmd-label">Run command after login (typed in the first terminal)
          <input id="f-scmd" placeholder="htop" />
        </label>
      </div>
      <div class="tabpane" data-pane="term" hidden id="f-term"></div>
      <div class="tabpane" data-pane="book" hidden>
        <label>Folder in the sidebar (blank = none)
          <input id="f-folder" list="folderList" placeholder="e.g. Production" />
          <datalist id="folderList"></datalist>
        </label>
        <label><input id="f-save" type="checkbox" checked /> Save this session (password stored encrypted by your system)</label>
      </div>
      <div class="row"><button type="button" id="f-cancel">Cancel</button><button id="f-go">Connect</button></div>
    </form>
  </dialog>

  <dialog id="settings">
    <form id="setForm">
      <h3>Settings</h3>
      <h4>Terminal</h4>
      <div id="set-term"></div>
      <h4>Connection defaults</h4>
      <label>Keep-alive every (seconds, 0 = off)
        <input id="set-keepalive" type="number" min="0" max="3600" />
      </label>
      <label><input id="set-compress" type="checkbox" /> Compression</label>
      <label>Connect timeout (seconds)
        <input id="set-timeout" type="number" min="5" max="120" />
      </label>
      <p class="hint">A session can override any of these in its own Advanced and Terminal tabs.</p>
      <div class="row"><button type="button" id="set-reset">Reset to defaults</button><button type="button" id="set-cancel">Cancel</button><button>Save</button></div>
    </form>
  </dialog>

  <dialog id="ask">
    <form id="askForm">
      <h3 id="askTitle"></h3>
      <input id="askInput" autocomplete="off" />
      <div class="row"><button type="button" id="askCancel">Cancel</button><button id="askOk">OK</button></div>
    </form>
  </dialog>
  <dialog id="fwd">
    <h3>Tunnels</h3>
    <ul id="fwdList"></ul>
    <form id="fwdForm">
      <select id="fwdKind">
        <option value="local">Local (-L): a port on this Mac → a host reached through the server</option>
        <option value="remote">Remote (-R): a port on the server → a host reached from this Mac</option>
        <option value="dynamic">Dynamic (-D): SOCKS5 proxy on this Mac, out through the server</option>
      </select>
      <div class="two">
        <input id="fwdBindHost" value="127.0.0.1" title="Address to listen on" />
        <input id="fwdBindPort" type="number" min="0" max="65535" placeholder="Listen port (0 = any)" />
      </div>
      <div class="two" id="fwdDest">
        <input id="fwdDestHost" placeholder="Destination host" />
        <input id="fwdDestPort" type="number" min="1" max="65535" placeholder="Destination port" />
      </div>
      <div id="fwdMsg"></div>
      <div class="row"><button type="button" id="fwdClose">Close</button><button>Start tunnel</button></div>
    </form>
  </dialog>

  <dialog id="snip">
    <form id="snipForm">
      <h3 id="snipTitle">New snippet</h3>
      <input id="s-id" type="hidden" />
      <input id="s-name" placeholder="Name" required />
      <textarea id="s-text" rows="6" placeholder="Command or text to insert" required></textarea>
      <label><input id="s-run" type="checkbox" /> Press Enter after inserting (runs it immediately)</label>
      <div class="row"><button type="button" id="s-cancel">Cancel</button><button>Save</button></div>
    </form>
  </dialog>
  <dialog id="manual">
    <div class="mhead">
      <strong>Tavrix Manual</strong>
      <span class="mbtns">
        <button id="manTour">Quick tour</button>
        <button id="manGithub" title="Open the same manual on GitHub">Open on GitHub ↗</button>
        <button id="manClose">Close</button>
      </span>
    </div>
    <iframe id="manualFrame" title="Tavrix manual"></iframe>
  </dialog>

  <div id="tour" hidden role="dialog" aria-modal="true" aria-labelledby="tourTitle">
    <div id="tourHole"></div>
    <div id="tourCard">
      <button id="tourClose" aria-label="Close the tour" title="Close the tour (Esc)">✕</button>
      <h3 id="tourTitle"></h3>
      <div id="tourBody"></div>
      <div class="tourfoot">
        <span id="tourDots" aria-hidden="true"></span>
        <span class="tourbtns">
          <button id="tourSkip">Skip tour</button>
          <button id="tourBack">Back</button>
          <button id="tourNext" class="primary">Next</button>
        </span>
      </div>
    </div>
  </div>
  <div id="menu" hidden></div>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <!-- Monaco's AMD loader defines a global `define`, so it must load after the UMD xterm scripts. -->
  <script src="../../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
